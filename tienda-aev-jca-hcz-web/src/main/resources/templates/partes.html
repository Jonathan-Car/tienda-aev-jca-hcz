<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="cabecera_publica(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${titulo} - LingTech|">LingTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<nav th:fragment="menu_publico" class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-0">
    <div class="navbar-nav align-items-center">
        <a sec:authorize="isAnonymous()" class="btn btn-outline-primary btn-sm" th:href="@{/login}">
            <i class="bi bi-box-arrow-in-right me-1"></i> Identificarse
        </a>

        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
            <span class="navbar-text me-3 text-dark">
                Hola, <strong sec:authentication="name">Usuario</strong>
            </span>

            <a class="btn btn-outline-primary btn-sm me-2" th:href="@{/users/profile}">
                <i class="bi bi-person-circle me-1"></i> Mi Perfil
            </a>

            <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline-dark btn-sm me-2" th:href="@{/admin/productos}">
                <i class="bi bi-person-lock me-1"></i> Admin Panel
            </a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-power"></i>
                </button>
            </form>
        </div>
    </div>
</nav>

<nav th:fragment="migas_publicas(pagina_actual, ruta_padre, nombre_padre)" aria-label="breadcrumb" class="container mt-4">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Inicio</a></li>

        <li th:if="${ruta_padre != null}" class="breadcrumb-item">
            <a th:href="@{${ruta_padre}}" th:text="${nombre_padre}" class="text-decoration-none">Padre</a>
        </li>

        <li class="breadcrumb-item active" aria-current="page" th:text="${pagina_actual}">Página Actual</li>
    </ol>
</nav>

<head th:fragment="cabecera_admin(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|ADMIN: ${titulo}|">Panel de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .navbar-admin { background-color: #212529 !important; }
        .sidebar-link.active { background-color: #0d6efd; color: white !important; }
    </style>
</head>

<nav th:fragment="menu_admin(activa)" class="navbar navbar-expand-lg navbar-dark navbar-admin mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" th:href="@{/admin/productos}">
            <i class="bi bi-shield-lock me-2"></i>LingTech <small class="text-white-50">Admin</small>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activa == 'productos' ? 'active' : ''}"
                       th:href="@{/admin/productos}">Productos</a>
                </li>
            </ul>
            <a class="btn btn-sm btn-outline-light" th:href="@{/}">
                <i class="bi bi-eye me-1"></i> Ver Tienda
            </a>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</html>
